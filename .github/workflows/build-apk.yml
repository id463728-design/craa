name: Build Android APK

on:
  push:
    branches: [ "main", "master" ] # Runs whenever you push code
  workflow_dispatch: # Allows you to click a button to run it manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Force Generate Missing Gradle Wrapper
      run: |
        npm install -g gradle || true
        gradle wrapper --gradle-version 8.7

    - name: Grant Execute Permissions for Gradle
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: game-apk
        path: app/build/outputs/apk/debug/app-debug.apk
