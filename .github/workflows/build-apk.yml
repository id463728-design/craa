name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4.2.2

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4.5.0
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Gradle Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Force Drop Keystore to All Expected Paths and Build APK
      run: |
        # 1. Create a clean test credentials file in your project directory
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
        # 2. Place it in the directory where 'debugConfig' looks
        cp debug.keystore /home/runner/work/craa/craa/debug.keystore || true
        
        # 3. Create the daemon folder and place it where 'externalOverride' looks
        mkdir -p /home/runner/.gradle/daemon/9.3.1/
        cp debug.keystore /home/runner/.gradle/daemon/9.3.1/debug.keystore || true
        
        # 4. Compile the application
        gradle assembleDebug



    - name: Upload Finished APK
      uses: actions/upload-artifact@v4.5.0
      with:
        name: game-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release Build v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

