name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4.2.2

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4.5.0
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Gradle Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Compile and Secure Build
      run: |
        # 1. Create a clean testing key store database locally
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
        # 2. Replicate dependencies for expected compilation profiles
        cp debug.keystore /home/runner/work/craa/craa/debug.keystore || true
        mkdir -p /home/runner/.gradle/daemon/9.3.1/
        cp debug.keystore /home/runner/.gradle/daemon/9.3.1/debug.keystore || true
        
        # 3. Compile core build assets
        gradle assembleDebug
        
        # 4. Extract Android System paths to align the package layers
        BUILD_TOOLS_DIR=$(dirname $(find /usr/local/lib/android/sdk/build-tools -name zipalign | head -n 1))
        
        # 5. Execute structural 4-byte index alignments
        $BUILD_TOOLS_DIR/zipalign -v 4 app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-aligned.apk
        
        # 6. Apply cryptographic verification stamps directly onto the package
        $BUILD_TOOLS_DIR/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey app/build/outputs/apk/debug/app-aligned.apk
        
        # 7. Finalize the replacement deployment asset
        mv app/build/outputs/apk/debug/app-aligned.apk app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4.5.0
      with:
        name: game-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release Build v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
